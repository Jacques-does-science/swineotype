[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swineotype"
dynamic = ["version"]
description = "Capsular serotyping of Streptococcus suis and Actinobacillus pleuropneumoniae from genome assemblies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
swineotype = "swineotype.main:main"

[tool.setuptools.dynamic]
version = {attr = "swineotype.__version__"}

[tool.setuptools.packages.find]
include = ["swineotype*"]

# The reference data ships inside the package and is found at runtime with
# importlib.resources.
[tool.setuptools.package-data]
swineotype = ["data/*"]
